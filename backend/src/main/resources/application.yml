server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-code-review-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_code_review?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.leaf.codereview: DEBUG
notification:
  platform-base-url: ${PLATFORM_BASE_URL:http://localhost:5173}
  dingtalk:
    webhook-url: ${DINGTALK_WEBHOOK_URL:}
    enabled: ${DINGTALK_ENABLED:true}

gitlab:
  api:
    enabled: ${GITLAB_API_ENABLED:false}
    base-url: ${GITLAB_BASE_URL:}
    token: ${GITLAB_TOKEN:}
    per-page: ${GITLAB_DIFF_PER_PAGE:100}

code-quality:
  review:
    enabled: ${CODE_QUALITY_REVIEW_ENABLED:false}
    provider: ${CODE_QUALITY_REVIEW_PROVIDER:DEEPSEEK}
    openai:
      api-key: ${OPENAI_API_KEY:}
      responses-url: ${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
      model: ${OPENAI_CODE_REVIEW_MODEL:gpt-5.5}
      timeout-seconds: ${OPENAI_CODE_REVIEW_TIMEOUT_SECONDS:120}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      messages-url: ${ANTHROPIC_MESSAGES_URL:https://api.anthropic.com/v1/messages}
      model: ${ANTHROPIC_CODE_REVIEW_MODEL:claude-sonnet-4-5}
      timeout-seconds: ${ANTHROPIC_CODE_REVIEW_TIMEOUT_SECONDS:120}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_CODE_REVIEW_MODEL:deepseek-v4-pro}
