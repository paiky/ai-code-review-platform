services:
  mysql:
    image: mysql:8.4
    profiles:
      - local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_code_review}
      MYSQL_USER: ${MYSQL_USERNAME:-ai_review}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      TZ: UTC
      SERVER_PORT: ${BACKEND_PORT:-8090}
      DATABASE_URL: ${DATABASE_URL:-}
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-http://localhost:8090}
      DINGTALK_ENABLED: ${DINGTALK_ENABLED:-true}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      GITLAB_API_ENABLED: ${GITLAB_API_ENABLED:-false}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_DIFF_PER_PAGE: ${GITLAB_DIFF_PER_PAGE:-100}
      LOCAL_REPO_CONTEXT_ENABLED: ${LOCAL_REPO_CONTEXT_ENABLED:-false}
      LOCAL_REPO_WORKSPACE_ROOT: ${LOCAL_REPO_WORKSPACE_ROOT:-/app/.local/review-workspaces}
      LOCAL_REPO_MAX_FETCH_SECONDS: ${LOCAL_REPO_MAX_FETCH_SECONDS:-120}
      LOCAL_REPO_MAX_SEARCH_SECONDS: ${LOCAL_REPO_MAX_SEARCH_SECONDS:-30}
      CODE_QUALITY_REVIEW_ENABLED: ${CODE_QUALITY_REVIEW_ENABLED:-false}
      CODE_QUALITY_REVIEW_PROVIDER: ${CODE_QUALITY_REVIEW_PROVIDER:-DEEPSEEK}
      CODE_QUALITY_REVIEW_PROXY: ${CODE_QUALITY_REVIEW_PROXY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESPONSES_URL: ${OPENAI_RESPONSES_URL:-https://api.openai.com/v1/responses}
      OPENAI_CODE_REVIEW_MODEL: ${OPENAI_CODE_REVIEW_MODEL:-gpt-5.4}
      OPENAI_CODE_REVIEW_TIMEOUT_SECONDS: ${OPENAI_CODE_REVIEW_TIMEOUT_SECONDS:-1000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MESSAGES_URL: ${ANTHROPIC_MESSAGES_URL:-https://api.anthropic.com/v1/messages}
      ANTHROPIC_CODE_REVIEW_MODEL: ${ANTHROPIC_CODE_REVIEW_MODEL:-claude-sonnet-4-5}
      ANTHROPIC_CODE_REVIEW_TIMEOUT_SECONDS: ${ANTHROPIC_CODE_REVIEW_TIMEOUT_SECONDS:-1000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CODE_REVIEW_MODEL: ${DEEPSEEK_CODE_REVIEW_MODEL:-deepseek-v4-pro}
      DEEPSEEK_CODE_REVIEW_TIMEOUT_SECONDS: ${DEEPSEEK_CODE_REVIEW_TIMEOUT_SECONDS:-1000}
      XIAOMIMO_API_KEY: ${XIAOMIMO_API_KEY:-}
      XIAOMIMO_BASE_URL: ${XIAOMIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      XIAOMIMO_CODE_REVIEW_MODEL: ${XIAOMIMO_CODE_REVIEW_MODEL:-mimo-v2.5-pro}
      XIAOMIMO_CODE_REVIEW_TIMEOUT_SECONDS: ${XIAOMIMO_CODE_REVIEW_TIMEOUT_SECONDS:-1000}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_CODE_REVIEW_MODEL: ${GLM_CODE_REVIEW_MODEL:-glm-5.1}
      GLM_CODE_REVIEW_TIMEOUT_SECONDS: ${GLM_CODE_REVIEW_TIMEOUT_SECONDS:-1000}
      AGENT_REVIEW_CONFIG_ENCRYPTION_KEY: ${AGENT_REVIEW_CONFIG_ENCRYPTION_KEY:-}
      AGENT_REVIEW_WORKER_TOKEN: ${AGENT_REVIEW_WORKER_TOKEN:-}
    volumes:
      - ${LOCAL_REPO_WORKSPACE_HOST_DIR:-./review-workspaces}:/app/.local/review-workspaces
    networks:
      - default
      - agent-internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('SERVER_PORT', '8090')}/api/health\", timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  agent-worker:
    build:
      context: ..
      dockerfile: deploy/agent-review-worker.Dockerfile
    restart: unless-stopped
    stop_grace_period: 930s
    environment:
      TZ: UTC
      AGENT_REVIEW_BACKEND_URL: http://backend:${BACKEND_PORT:-8090}
      AGENT_REVIEW_WORKER_TOKEN: ${AGENT_REVIEW_WORKER_TOKEN:-}
      AGENT_REVIEW_WORKER_ID_PREFIX: ${AGENT_REVIEW_WORKER_ID_PREFIX:-agent-worker}
      AGENT_REVIEW_WORKSPACE_ROOT: /workspaces
      HTTPS_PROXY: http://agent-egress-proxy:3128
      NO_PROXY: backend,127.0.0.1,localhost
    volumes:
      - ${LOCAL_REPO_WORKSPACE_HOST_DIR:-./review-workspaces}:/workspaces:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/agent-review:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      backend:
        condition: service_healthy
      agent-egress-proxy:
        condition: service_started
    networks:
      - agent-internal
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-m",
          "app.agent_review.worker",
          "--healthcheck",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  agent-egress-proxy:
    build:
      context: ..
      dockerfile: deploy/agent-egress-proxy.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/spool/squid:rw,nosuid,size=64m
      - /var/log/squid:rw,nosuid,size=16m
      - /run:rw,nosuid,size=8m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - agent-internal

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-8090}:80"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8090}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:

networks:
  agent-internal:
    internal: true
