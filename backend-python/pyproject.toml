[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-backend-python"
version = "0.1.0"
description = "Python backend skeleton for the AI code review platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "pymysql>=1.1.0",
    "python-multipart==0.0.22",
    "PyYAML==6.0.3",
    "markdown-it-py==4.0.0",
    "python-docx==1.2.0",
    "pypdf==7.0.1",
    "sqlalchemy>=2.0.0",
    "tiktoken==0.12.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.22.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.review_rules" = ["assets/LICENSE", "assets/SOURCE", "assets/*.json", "assets/rule_docs/*.md"]
"app.agent_review_spike" = ["cl100k_base.tiktoken"]
